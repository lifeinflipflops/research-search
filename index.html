<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Research</title>

  <!--
    REPLACE PASTE_YOUR_SEARCH_ENGINE_ID_HERE below with your
    Google Programmable Search Engine ID.
    Example:
    https://cse.google.com/cse.js?cx=0123456789abcdef
  -->
  <script async src="https://cse.google.com/cse.js?cx=63c8dfd719bdb445c">
</script>
<div class="gcse-search"></div>

  <style>
    :root {
      color-scheme: light;
      --page-bg: #f7f8fa;
      --surface: #ffffff;
      --text: #202124;
      --muted: #5f6368;
      --border: #dadce0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: var(--page-bg);
    }

    header {
      padding: 28px 24px 12px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.65rem, 3vw, 2.2rem);
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    main {
      width: min(1400px, calc(100% - 32px));
      margin: 18px auto 48px;
      padding: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 2px 10px rgba(60, 64, 67, 0.08);
    }

/* Let Google's search/results element fill our centred container. */
.gcse-search,
.gsc-control-cse,
.gsc-control-wrapper-cse,
.gsc-results-wrapper-nooverlay,
.gsc-results-wrapper-visible,
.gsc-results,
.gsc-wrapper,
.gsc-webResult,
.gsc-result {
  width: 100% !important;
  max-width: none !important;
}

.gsc-results-wrapper-nooverlay {
  margin-left: auto !important;
  margin-right: auto !important;
}

    /* Keep the page clean on smaller Chromebook screens. */
    @media (max-width: 640px) {
      header { padding-top: 20px; }
      main {
        width: calc(100% - 20px);
        margin-top: 10px;
        padding: 14px;
        border-radius: 10px;
      }
      .subtitle { display: none; }
    }
  </style>
</head>

<body>
  <header>
    <h1>Research</h1>
    <p class="subtitle">Search trusted learning and creative sites</p>
  </header>

  <main>
    <!-- q is the default query parameter.
         Visiting this page as ?q=volcanoes will search automatically. -->
    <div class="gcse-search" data-queryParameterName="q"></div>
  </main>
</body>
</html>
